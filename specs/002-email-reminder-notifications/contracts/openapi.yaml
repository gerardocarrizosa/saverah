openapi: 3.1.0
info:
  title: Saverah Email Reminder Notifications API
  version: 0.1.0
  description: API route contracts for opt-in reminder email notifications and scheduled Resend delivery.
servers:
  - url: /api
paths:
  /reminders:
    get:
      summary: List reminders with email notification settings
      security:
        - supabaseCookie: []
      responses:
        '200':
          description: Reminders returned for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a reminder with optional email notification settings
      security:
        - supabaseCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '201':
          description: Reminder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reminders/{id}:
    get:
      summary: Get a reminder with email notification settings
      security:
        - supabaseCookie: []
      parameters:
        - $ref: '#/components/parameters/ReminderId'
      responses:
        '200':
          description: Reminder returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update reminder email notification settings
      security:
        - supabaseCookie: []
      parameters:
        - $ref: '#/components/parameters/ReminderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderPatchInput'
      responses:
        '200':
          description: Reminder updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reminders/notifications/run:
    post:
      summary: Run the daily reminder email notification check
      description: Trusted operational endpoint for cron runners. Sends Spanish reminder emails through Resend for eligible unpaid reminders and records sent, failed, or skipped outcomes.
      security:
        - cronBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                notification_date:
                  type: string
                  format: date
                  description: Optional override for deterministic testing; defaults to today's server date.
      responses:
        '200':
          description: Notification run completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationRunResult'
        '401':
          description: Missing or invalid cron bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    supabaseCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
    cronBearer:
      type: http
      scheme: bearer
  parameters:
    ReminderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthenticated request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Reminder not found for the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request failed shared Yup validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    ReminderInput:
      type: object
      additionalProperties: false
      required: [name, due_day, category, recurrence]
      properties:
        name:
          type: string
          maxLength: 100
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        cutoff_day:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 31
        category:
          type: string
        recurrence:
          type: string
          enum: [monthly, yearly, weekly]
        notes:
          type: string
          maxLength: 500
        email_notifications_enabled:
          type: boolean
          default: false
        email_notification_timings:
          type: array
          default: []
          items:
            type: integer
            enum: [0, 1, 3, 7]
      allOf:
        - if:
            properties:
              email_notifications_enabled:
                const: true
          then:
            required: [email_notification_timings]
            properties:
              email_notification_timings:
                minItems: 1
    ReminderPatchInput:
      type: object
      additionalProperties: false
      description: Partial update accepted by the existing reminder PATCH route; if email notifications are enabled, at least one timing must be present in the resulting update payload.
      properties:
        name:
          type: string
          maxLength: 100
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        cutoff_day:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 31
        category:
          type: string
        recurrence:
          type: string
          enum: [monthly, yearly, weekly]
        notes:
          type: string
          maxLength: 500
        email_notifications_enabled:
          type: boolean
        email_notification_timings:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 7]
      allOf:
        - if:
            properties:
              email_notifications_enabled:
                const: true
          then:
            required: [email_notification_timings]
            properties:
              email_notification_timings:
                minItems: 1
    Reminder:
      type: object
      required:
        - id
        - user_id
        - name
        - due_day
        - recurrence
        - category
        - is_active
        - created_at
        - email_notifications_enabled
        - email_notification_timings
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        due_day:
          type: integer
        cutoff_day:
          type:
            - integer
            - 'null'
        recurrence:
          type: string
          enum: [monthly, yearly, weekly]
        category:
          type: string
        notes:
          type:
            - string
            - 'null'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        email_notifications_enabled:
          type: boolean
        email_notification_timings:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 7]
    ReminderResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Reminder'
    ReminderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
    NotificationRunResult:
      type: object
      required:
        - notification_date
        - evaluated_count
        - sent_count
        - failed_count
        - skipped_count
      properties:
        notification_date:
          type: string
          format: date
        evaluated_count:
          type: integer
        sent_count:
          type: integer
        failed_count:
          type: integer
        skipped_count:
          type: integer
        sent:
          type: array
          items:
            $ref: '#/components/schemas/NotificationOutcome'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/NotificationOutcome'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/NotificationOutcome'
    NotificationOutcome:
      type: object
      required: [reminder_id, timing_days_before, status]
      properties:
        reminder_id:
          type: string
          format: uuid
        timing_days_before:
          type: integer
          enum: [0, 1, 3, 7]
        status:
          type: string
          enum: [sent, failed, skipped]
        notification_id:
          type: string
          format: uuid
        provider_message_id:
          type: string
        error_message:
          type: string
